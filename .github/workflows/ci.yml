name: CI

on:
  pull_request:
  push:
    branches: [latest]
    tags: ["*"]

jobs:
  build:
    strategy:
      matrix:
        node: ["22.12.0", "24.x"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run type-check
      - run: npm test
      - run: npm run code-verification -w ts-morph
